name: college-maintenance-lab

services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:${COLLEGE_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./labs:/labs:ro
    secrets:
      - postgres_admin_password
      - college_learner_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U college_learner -d college_learning"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  postgres_data:

secrets:
  postgres_admin_password:
    file: ./.local/postgres-admin-password
  college_learner_password:
    file: ./.local/college-learner-password

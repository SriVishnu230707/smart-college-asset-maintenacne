services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: college_deploy
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets: [postgres_password]
    volumes: [deploy_database:/var/lib/postgresql]
    ports: ['127.0.0.1::5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d college_deploy']
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    image: college-maintenance:local
    build: .
    command: ['python', '-m', 'college_maintenance.deployment']
    environment:
      COLLEGE_DATABASE_URL_FILE: /run/secrets/admin_url
    secrets: [admin_url, owner_url, runtime_url]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    image: college-maintenance:local
    build: .
    environment:
      COLLEGE_DATABASE_URL_FILE: /run/secrets/runtime_url
      COLLEGE_API_TOKENS_FILE: /run/secrets/api_tokens
      COLLEGE_POOL_SIZE: '2'
      COLLEGE_MAX_OVERFLOW: '1'
    secrets: [runtime_url, api_tokens]
    volumes: [deploy_uploads:/app/.local/uploads]
    ports: ['127.0.0.1::8000']
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready',timeout=3)"]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  deploy_database:
  deploy_uploads:
secrets:
  postgres_password: {file: '${COLLEGE_DEPLOY_SECRETS:?}/postgres_password'}
  admin_url: {file: '${COLLEGE_DEPLOY_SECRETS:?}/admin_url'}
  owner_url: {file: '${COLLEGE_DEPLOY_SECRETS:?}/owner_url'}
  runtime_url: {file: '${COLLEGE_DEPLOY_SECRETS:?}/runtime_url'}
  api_tokens: {file: '${COLLEGE_DEPLOY_SECRETS:?}/api_tokens'}
